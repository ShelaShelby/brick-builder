[package]
name = "brick-builder"
version = "1.0.0"
edition = "2021"
description = "Build with toy bricks in 3D, load ready-made builds and follow step-by-step instructions."
license = "MIT"

[dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "hdr",
    "png",
    "tonemapping_luts",
    "ktx2",
    "zstd",
    "x11",
] }
bevy_egui = { version = "0.36", default-features = false, features = ["default_fonts", "render", "manage_clipboard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
